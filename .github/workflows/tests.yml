name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]   # 3.10 = JetPack 6 / Ubuntu 22.04 on the Jetson
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt opencv-python-headless
      - name: Run tests (no hardware needed)
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests
      - name: Accuracy / latency validation on simulated swings
        env:
          MPLBACKEND: Agg
        run: python -m dckft.run validate --n 8
